  <text x="42" y="55" fill="#18181b" font-family="monospace" font-size="10" font-weight="bold">GRID SYSTEMS</text>
  <text x="42" y="68" fill="#71717a" font-family="monospace" font-size="7">JOSEF MÜLLER-BROCKMANN</text>
