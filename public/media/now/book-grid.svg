<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#f4f4f5"/>
  <!-- Modular grid lines -->
  <line x1="40" y1="30" x2="260" y2="30" stroke="#d4d4d8" stroke-width="1"/>
  <line x1="40" y1="80" x2="260" y2="80" stroke="#d4d4d8" stroke-width="1"/>
  <line x1="40" y1="130" x2="260" y2="130" stroke="#d4d4d8" stroke-width="1"/>
  <line x1="40" y1="170" x2="260" y2="170" stroke="#d4d4d8" stroke-width="1"/>
  <line x1="40" y1="30" x2="40" y2="170" stroke="#d4d4d8" stroke-width="1"/>
  <line x1="95" y1="30" x2="95" y2="170" stroke="#d4d4d8" stroke-width="1"/>
  <line x1="150" y1="30" x2="150" y2="170" stroke="#d4d4d8" stroke-width="1"/>
